<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Eating Next">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>What Are We Eating Next</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍲 What are we eating next?</h1>
    <div id="who" hidden><span id="who-name"></span> <button id="logout" class="link">Log out</button></div>
  </header>

  <main id="app">
    <p class="muted">Loading…</p>
  </main>

  <template id="tpl-setup">
    <section class="card">
      <h2>Almost there</h2>
      <p>The app isn't connected to a database yet. Fill in <code>config.js</code> with your Supabase project URL and anon key — see the README.</p>
    </section>
  </template>

  <template id="tpl-auth">
    <section class="card narrow">
      <div class="tabs">
        <button data-mode="login" class="active">Log in</button>
        <button data-mode="signup">Sign up</button>
      </div>
      <form id="auth-form">
        <label>Username <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required pattern="[a-zA-Z0-9_.\-]{3,30}" title="3–30 letters, numbers, . _ -"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
        <button type="submit" class="primary">Log in</button>
        <p class="error" hidden></p>
      </form>
    </section>
  </template>

  <template id="tpl-household">
    <section class="card narrow">
      <h2>Set up your kitchen</h2>
      <form id="create-form">
        <p>First one here? Create a household.</p>
        <label>Household name <input name="name" placeholder="Our kitchen"></label>
        <button class="primary">Create</button>
      </form>
      <hr>
      <form id="join-form">
        <p>Partner already set it up? Enter their join code.</p>
        <label>Join code <input name="code" required placeholder="A1B2C3D4" autocapitalize="characters" autocomplete="off"></label>
        <button>Join</button>
      </form>
      <p class="error" hidden></p>
    </section>
  </template>

  <template id="tpl-main">
    <nav class="bottom-nav">
      <button data-view="meal" class="active"><span>🗳️</span>Vote</button>
      <button data-view="calendar"><span>📅</span>Calendar</button>
      <button data-view="regulars"><span>⭐</span>Regulars</button>
      <button data-view="groceries"><span>🧺</span>Groceries</button>
      <button data-view="home"><span>🏠</span>Home</button>
    </nav>

    <datalist id="dish-names"></datalist>

    <div data-view="meal">
      <section class="card">
        <div id="winner"></div>
        <form id="option-form" class="row">
          <input name="name" placeholder="Suggest a meal…" required autocomplete="off" enterkeyhint="done" list="dish-names">
          <select name="kind" class="kind" aria-label="Home or out">
            <option value="home">🏠</option>
            <option value="out">🍽️</option>
          </select>
          <button class="primary">Add</button>
        </form>
        <ul id="options" class="list"></ul>
        <div class="row end">
          <button id="new-round" class="link">Clear and start a new round</button>
        </div>
      </section>
      <section class="card" id="stale-card">
        <h2>💭 It's been a while</h2>
        <p class="muted small">Regulars you haven't had in 2+ weeks.</p>
        <ul id="stale" class="list"></ul>
      </section>
    </div>

    <section data-view="calendar" class="card" hidden>
      <div class="cal-head">
        <button data-act="cal-prev" aria-label="Previous month">‹</button>
        <h2 id="cal-title"></h2>
        <button data-act="cal-next" aria-label="Next month">›</button>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <p class="muted small cal-legend">🏠 made at home · 🍽️ ate out</p>
      <h3 id="day-title"></h3>
      <ul id="day-meals" class="list"></ul>
      <form id="eaten-form">
        <div class="row">
          <input name="name" placeholder="What did we eat?" required autocomplete="off" list="dish-names">
          <select name="kind" class="kind" aria-label="Home or out">
            <option value="home">🏠</option>
            <option value="out">🍽️</option>
          </select>
        </div>
        <div class="row">
          <select name="slot" aria-label="Meal">
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="snack">Snack</option>
          </select>
          <input name="place" placeholder="Where? (optional)" autocomplete="off" hidden>
          <button class="primary">Log it</button>
        </div>
      </form>
    </section>

    <div data-view="regulars" hidden>
      <section class="card">
        <h2>🏠 We make at home</h2>
        <form class="row dish-form" data-kind="home">
          <input name="name" placeholder="e.g. Rajma chawal" required autocomplete="off" enterkeyhint="done">
          <button class="primary">Add</button>
        </form>
        <ul id="dishes-home" class="list"></ul>
      </section>
      <section class="card">
        <h2>🍽️ We eat out</h2>
        <form class="dish-form" data-kind="out">
          <div class="row">
            <input name="name" placeholder="e.g. Burrito bowl" required autocomplete="off">
            <input name="place" placeholder="Where?" autocomplete="off" class="place">
            <button class="primary">Add</button>
          </div>
        </form>
        <ul id="dishes-out" class="list"></ul>
      </section>
      <p class="muted small center">🗳️ adds it to the vote · ✓ logs it as eaten today</p>
    </div>

    <section data-view="groceries" class="card" hidden>
      <form id="grocery-form" class="row">
        <input name="name" placeholder="What do we have?" required autocomplete="off" enterkeyhint="done">
        <input name="qty" placeholder="Qty" class="qty" autocomplete="off">
        <button class="primary">Add</button>
      </form>
      <ul id="groceries" class="list"></ul>
      <p class="muted small">Tap ✕ when something's used up.</p>
    </section>

    <section data-view="home" class="card" hidden>
      <h2 id="hh-name"></h2>
      <p>Join code for your partner: <code id="hh-code"></code></p>
      <h3>Members</h3>
      <ul id="members" class="list compact"></ul>
    </section>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
